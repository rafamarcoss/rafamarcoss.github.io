name: Daily AI Signal

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-signal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate daily edition
        run: node scripts/generate-ai-signal.mjs
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Publish feed update
        run: |
          if git diff --quiet -- news/feed.json; then
            echo "No feed changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/feed.json
          git commit -m "news: publish daily AI Signal"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Push rejected; retrying after synchronizing main"
              sleep 2
            fi
          done
          exit 1
