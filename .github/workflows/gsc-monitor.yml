name: Google Search Console Monitor

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      submit_sitemap:
        description: Submit sitemap before inspection
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gsc-monitor
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Submit sitemap
        if: ${{ inputs.submit_sitemap == true }}
        run: npm run gsc:submit

      - name: Inspect sitemap URLs
        run: npm run gsc:inspect
