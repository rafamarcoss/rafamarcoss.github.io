name: Google Search Console Monitor

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      submit_sitemap:
        description: Submit sitemap before inspection
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gsc-monitor
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download previous report
        uses: actions/download-artifact@v4
        with:
          name: gsc-index-report
          path: reports/previous/
        continue-on-error: true

      - name: Submit sitemap
        if: ${{ inputs.submit_sitemap == true }}
        run: npm run gsc:submit

      - name: Inspect sitemap URLs
        env:
          GSC_PREVIOUS_REPORT: reports/previous/gsc-index-status.json
        run: npm run gsc:inspect

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gsc-index-report
          path: reports/gsc-index-status.json
          if-no-files-found: warn
