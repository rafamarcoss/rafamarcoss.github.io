<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Signal: briefing diario de inteligencia artificial, mercados, educación, trabajo y regulación.">
  <meta name="theme-color" content="#F2F4EE">
  <link rel="canonical" href="https://rafaelmarcos.tech/news/">
  <title>AI Signal — Rafael Marcos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
    :root{--paper:#F2F4EE;--card:#FFFFF9;--ink:#0B0E0F;--muted:rgba(11,14,15,.64);--line:rgba(11,14,15,.13);--mint:#B0DFAA;--teal:#24969B;--blue:#0860A7;--royal:#0234C0;--coral:#C64240;--display:'Syne',sans-serif;--body:'Outfit',sans-serif}
    html{scroll-behavior:smooth;background:var(--paper);overflow-x:hidden}
    body{min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:var(--body);line-height:1.7;background:radial-gradient(circle at 12% 2%,rgba(176,223,170,.75),transparent 28rem),radial-gradient(circle at 90% 24%,rgba(36,150,155,.22),transparent 32rem),var(--paper)}
    a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 2rem));margin-inline:auto}
    nav{position:sticky;top:.7rem;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:.7rem;padding:.55rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,249,.82);backdrop-filter:blur(18px);box-shadow:0 16px 54px rgba(8,96,167,.09)}
    .brand{display:flex;align-items:center;gap:.65rem;font-family:var(--display);font-weight:800;letter-spacing:-.04em}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--ink),var(--blue),var(--teal))}
    .nav-actions{display:flex;align-items:center;gap:.5rem}.back,.lang button{min-height:38px;border:1px solid var(--line);border-radius:999px;background:transparent;font:700 .72rem 'JetBrains Mono',monospace;cursor:pointer}.back{display:inline-flex;align-items:center;padding:0 1rem}.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px}.lang button{min-width:34px;border:0}.lang button[aria-pressed="true"]{color:var(--paper);background:var(--ink)}
    header{padding:clamp(5rem,11vw,9rem) 0 4rem}.eyebrow{color:var(--teal);font:700 .75rem 'JetBrains Mono',monospace;letter-spacing:.11em;text-transform:uppercase}.masthead{margin-top:1rem;font:800 clamp(4rem,14vw,10rem)/.78 var(--display);letter-spacing:-.09em}.masthead span{color:transparent;background:linear-gradient(110deg,var(--blue),var(--teal),var(--coral));background-clip:text}.lead{max-width:64ch;margin-top:2rem;color:var(--muted);font-size:clamp(1.1rem,2vw,1.35rem)}
    main{padding-bottom:6rem}.status{padding:2rem;border:1px dashed var(--line);border-radius:28px;color:var(--muted)}
    .archive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.edition-card{display:flex;min-height:280px;flex-direction:column;justify-content:space-between;padding:1.7rem;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,249,.72);box-shadow:0 20px 62px rgba(11,14,15,.06);transition:.25s}.edition-card:hover{transform:translateY(-5px);border-color:rgba(36,150,155,.35)}.meta{display:flex;justify-content:space-between;gap:1rem;color:var(--teal);font:700 .72rem 'JetBrains Mono',monospace;text-transform:uppercase}.edition-card h2{margin-top:1rem;font:700 clamp(1.8rem,3.5vw,3.1rem)/.98 var(--display);letter-spacing:-.06em}.edition-card p{margin-top:1rem;color:var(--muted)}.read{margin-top:1.5rem;font:700 .75rem 'JetBrains Mono',monospace}
    .article-head{max-width:900px;min-width:0}.article-head h1{margin-top:1rem;overflow-wrap:anywhere;font:800 clamp(3rem,8vw,6.7rem)/.88 var(--display);letter-spacing:-.075em}.dek{margin-top:1.5rem;color:var(--muted);font-size:clamp(1.15rem,2.2vw,1.45rem)}.article-meta{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.6rem}.chip{padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:700 .68rem 'JetBrains Mono',monospace}
    .article-body{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:clamp(2rem,6vw,5rem);align-items:start;margin-top:4rem}.article-body>*{min-width:0}.story{max-width:760px}.intro{padding-bottom:2.5rem;border-bottom:1px solid var(--line);font-size:1.22rem;line-height:1.72}.section{padding:2.8rem 0;border-bottom:1px solid var(--line)}.section h2{overflow-wrap:anywhere;font:700 clamp(1.8rem,4vw,3.2rem)/1 var(--display);letter-spacing:-.055em}.section p{margin-top:1rem;color:var(--muted);font-size:1.08rem;white-space:pre-line}.closing{margin-top:2.8rem;padding:2rem;border-radius:28px;color:#fff;background:linear-gradient(145deg,var(--ink),#0D3140,var(--blue))}
    aside{position:sticky;top:6rem;display:grid;gap:1rem}.aside-card{padding:1.3rem;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,249,.72)}.aside-card h3{font:700 1rem var(--display)}.takeaways{display:grid;gap:.8rem;margin-top:1rem;list-style:none;counter-reset:take}.takeaways li{counter-increment:take;color:var(--muted);font-size:.92rem}.takeaways li::before{content:counter(take,decimal-leading-zero);display:block;margin-bottom:.2rem;color:var(--teal);font:700 .67rem 'JetBrains Mono',monospace}
    .sources{margin-top:4rem}.sources h2{font:700 clamp(2rem,4vw,3.4rem) var(--display);letter-spacing:-.06em}.source-list{display:grid;gap:.7rem;margin-top:1.4rem;list-style:none}.source-list a{display:grid;grid-template-columns:150px 1fr auto;gap:1rem;align-items:center;padding:1rem;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,249,.62)}.source-cat{color:var(--teal);font:700 .66rem 'JetBrains Mono',monospace;text-transform:uppercase}.source-title{font-weight:650}.source-arrow{font-size:1.2rem}
    footer{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:2rem 0;color:var(--muted);border-top:1px solid var(--line)}
    @media(max-width:800px){.archive,.article-body{grid-template-columns:1fr}aside{position:static}.source-list a{grid-template-columns:1fr auto}.source-cat{grid-column:1/-1}.brand>span:last-child{display:none}}
    @media(max-width:520px){.shell{width:min(100% - 1rem,1120px)}.back{padding:0 .7rem}.masthead{font-size:3.7rem}.article-head h1{font-size:2.6rem;overflow-wrap:normal;letter-spacing:-.06em}.edition-card{min-height:240px;padding:1.25rem}}
  </style>
</head>
<body>
  <nav class="shell" aria-label="Navegación">
    <a class="brand" href="../"><span class="mark">RM</span><span>Rafael Marcos.</span></a>
    <div class="nav-actions">
      <a class="back" href="../#news" data-ui="back">← Portfolio</a>
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>

  <header class="shell">
    <p class="eyebrow">Rafael Marcos · Daily briefing</p>
    <div class="masthead">AI <span>Signal</span></div>
    <p class="lead" data-ui="lead">Una lectura diaria que conecta IA, mercados, educación, trabajo y regulación. Selección automática; criterio editorial y fuentes siempre visibles.</p>
  </header>

  <main class="shell" id="content"><p class="status" data-ui="loading">Cargando ediciones…</p></main>

  <footer class="shell"><span>© 2026 Rafael Marcos Serrano</span><a href="mailto:rafaelmarcos2604@gmail.com">rafaelmarcos2604@gmail.com</a></footer>

  <script>
    const ui = {
      es: { back:'← Portfolio', lead:'Una lectura diaria que conecta IA, mercados, educación, trabajo y regulación. Selección automática; criterio editorial y fuentes siempre visibles.', loading:'Cargando ediciones…', read:'Leer edición', minutes:'min de lectura', takeaways:'Qué hacer con esto', sources:'Fuentes de esta edición', missing:'No se ha encontrado esta edición.' },
      en: { back:'← Portfolio', lead:'A daily read connecting AI, markets, education, work and regulation. Automated selection, editorial judgement and visible sources.', loading:'Loading editions…', read:'Read edition', minutes:'min read', takeaways:'What to do with this', sources:'Sources for this edition', missing:'This edition could not be found.' }
    };
    const params = new URLSearchParams(location.search);
    let lang = params.get('lang') === 'en' ? 'en' : 'es';
    let feed = { articles: [] };
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const safeUrl = value => { try { const url = new URL(value); return ['http:','https:'].includes(url.protocol) ? url.href : '#'; } catch { return '#'; } };
    const formatDate = date => new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : 'es-ES', { day:'2-digit', month:'long', year:'numeric' }).format(new Date(`${date}T12:00:00`));

    function applyUi() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-ui]').forEach(el => { const value = ui[lang][el.dataset.ui]; if (value) el.textContent = value; });
      document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
    }

    function renderArchive() {
      document.title = 'AI Signal — Rafael Marcos';
      const cards = feed.articles.map(article => {
        const content = article.content?.[lang] || article.content?.es || {};
        return `<a class="edition-card" href="?slug=${encodeURIComponent(article.slug)}&lang=${lang}"><div><div class="meta"><span>${esc((article.categories||[]).slice(0,2).join(' · '))}</span><time>${esc(formatDate(article.date))}</time></div><h2>${esc(content.title)}</h2><p>${esc(content.dek)}</p></div><span class="read">${ui[lang].read} →</span></a>`;
      }).join('');
      document.getElementById('content').innerHTML = `<section class="archive">${cards || `<p class="status">${ui[lang].missing}</p>`}</section>`;
    }

    function renderArticle(article) {
      const content = article.content?.[lang] || article.content?.es || {};
      document.title = `${content.title} — AI Signal`;
      const sections = (content.sections || []).map(section => `<section class="section"><h2>${esc(section.heading)}</h2><p>${esc(section.body)}</p></section>`).join('');
      const takeaways = (content.takeaways || []).map(item => `<li>${esc(item)}</li>`).join('');
      const sources = (article.sources || []).map(source => `<li><a href="${esc(safeUrl(source.url))}" target="_blank" rel="noopener noreferrer"><span class="source-cat">${esc(source.category)}</span><span class="source-title">${esc(source.title)}</span><span class="source-arrow">↗</span></a></li>`).join('');
      document.getElementById('content').innerHTML = `<article><div class="article-head"><div class="meta"><span>AI Signal</span><time datetime="${esc(article.date)}">${esc(formatDate(article.date))}</time></div><h1>${esc(content.title)}</h1><p class="dek">${esc(content.dek)}</p><div class="article-meta"><span class="chip">${esc(article.readingMinutes)} ${ui[lang].minutes}</span>${(article.categories||[]).map(category=>`<span class="chip">${esc(category)}</span>`).join('')}</div></div><div class="article-body"><div class="story"><p class="intro">${esc(content.intro)}</p>${sections}<p class="closing">${esc(content.closing)}</p></div><aside><div class="aside-card"><h3>${ui[lang].takeaways}</h3><ol class="takeaways">${takeaways}</ol></div></aside></div><section class="sources"><h2>${ui[lang].sources}</h2><ul class="source-list">${sources}</ul></section></article>`;
    }

    function render() {
      applyUi();
      const slug = params.get('slug');
      if (!slug) return renderArchive();
      const article = feed.articles.find(item => item.slug === slug);
      if (!article) { document.getElementById('content').innerHTML = `<p class="status">${ui[lang].missing}</p>`; return; }
      renderArticle(article);
    }

    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => { lang = button.dataset.lang; params.set('lang',lang); history.replaceState({},'',`${location.pathname}?${params}`); render(); }));
    applyUi();
    fetch('feed.json',{cache:'no-store'}).then(response => { if(!response.ok) throw new Error(response.status); return response.json(); }).then(data => { feed=data; render(); }).catch(() => { document.getElementById('content').innerHTML=`<p class="status">${ui[lang].missing}</p>`; });
  </script>
</body>
</html>
